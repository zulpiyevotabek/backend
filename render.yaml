services:
  - type: web
    name: ielts-mock-backend
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ielts-mock-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: STATS_TZ
        value: Asia/Tashkent

databases:
  - name: ielts-mock-db
    databaseName: ielts_mock
    user: ielts_mock_user
    plan: basic-256mb
    region: singapore
